name: Reproducible IAMC baseline
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies and tests
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Fetch official revision-pinned IAMC tutorial data
        run: python -m residual_pathways fetch-tutorial --output data/tutorial_data.csv
      - name: Analyze real published scenarios and verify via pyam
        run: python -m residual_pathways analyze --input data/tutorial_data.csv --output results/tutorial --pyam-check
      - name: Assert real data and no gross-emissions overclaim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('results/tutorial/results.json').read_text())
          assert result['source']['rows'] > 500
          assert result['comparison']['matched_rows'] == 18
          assert len(result['comparison']['common_scenarios']) == 6
          assert result['accounting']['i3_scenarios'] == 0
          print('Source-derived comparisons: 18; no fabricated gross/CDR.')
          PY
      - name: Verify real-model source-derived observations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path("results/tutorial/results.json").read_text())["comparison"]
          expected = json.loads(Path("data/derived/verified_tutorial_comparison_2050.json").read_text())
          assert actual["cohort_models"] == expected["cohort_models"]
          assert actual["common_scenarios"] == expected["common_scenarios"]
          assert actual["rows"] == expected["rows"]
          assert "<svg" in Path("results/tutorial/co2_2050.svg").read_text()
          print("Every source-derived 2050 number matches the independently recorded reference.")
          PY
      - name: Run actual synthetic SciPy/HiGHS optimisation
        run: |
          python -m residual_pathways model-sensitivity --output results/model_sensitivity
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("results/model_sensitivity/experiment_results.json").read_text())
          assert len(r["results"]) == 6
          assert r["results"][0]["status"] == "OPTIMAL"
          assert r["results"][-1]["status"] == "INFEASIBLE_OR_UNSOLVED"
          PY
      - name: Verify signed, decadal source reporting and no gross assumption
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("results/tutorial/decadal_trajectory.json").read_text())
          assert len(x["observations"]) == 180
          assert x["year_summaries"][-1]["year"] == 2100
          assert x["year_summaries"][-1]["negative_reported_co2_count"] == 9
          assert "not a" in x["interpretation"] or "cannot independently identify" in x["interpretation"]
          PY
      - name: Record truthful MESSAGEix/GAMS preflight status
        run: |
          python -m residual_pathways gams-preflight --output results/gams_preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("results/gams_preflight.json").read_text())
          assert not p["westeros_solved"]
          assert p["scientific_status"] == "NOT_A_MESSAGEIX_EXPERIMENT"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: published-iamc-baseline
          path: results/tutorial/
          retention-days: 30
