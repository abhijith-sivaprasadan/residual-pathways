name: AR6 public teaching subset preflight and variable-coverage pilot
on:
  push:
    paths:
      - '.github/workflows/ar6-public-source-pilot.yml'
      - 'src/residual_pathways/coverage_audit.py'
      - 'src/residual_pathways/stratify.py'
      - 'src/residual_pathways/case_audit.py'
      - 'src/residual_pathways/__main__.py'
      - 'data/derived/ar6_teaching_2050_summary.json'
      - 'config/ar6_variable_candidates.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local source-audit software and metadata reader
        run: python -m pip install -e '.[metadata]'
      - name: Download independently labelled public teaching subset
        run: |
          mkdir -p data/ar6-private results/ar6-teaching-pilot
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 \
            --output data/ar6-private/AR6-demo-data.csv \
            'https://zenodo.org/records/20056332/files/AR6-demo-data.csv?download=1'
          echo '274ed494a024744052df67611c7322e7  data/ar6-private/AR6-demo-data.csv' | md5sum --check
          python - <<'PY'
          import csv, hashlib, pathlib
          p=pathlib.Path('data/ar6-private/AR6-demo-data.csv')
          with p.open(encoding='utf-8-sig',newline='') as f:
              rd=csv.reader(f)
              h=next(rd)
          print('Provenance: Zenodo 20056332 (IIASA-labelled teaching subset), NOT authenticated official World v1.1')
          print('Source bytes:', p.stat().st_size)
          print('Columns:', len(h))
          print('First headers:', h[:8])
          print('Year 2050 column present:', '2050' in h or 'X2050' in h)
          PY
      - name: Run actual source-data coverage audit, no raw data redistribution
        run: |
          python -m residual_pathways audit-ar6 \
            --input data/ar6-private/AR6-demo-data.csv \
            --candidates config/ar6_variable_candidates.json \
            --output results/ar6-teaching-pilot/variable_coverage_2050.json \
            --year 2050
          python - <<'PY'
          import json
          d=json.load(open('results/ar6-teaching-pilot/variable_coverage_2050.json'))
          print('Teaching source SHA-256:',d['source_sha256'])
          print('Teaching-source model-scenario pairs:',d['world_model_scenario_pairs'])
          print('Teaching-source series rows:',d['csv_series_rows'])
          print('Matched 2050 candidates:')
          for key, val in sorted(d['candidate_coverage'].items()):
              print(key, val['model_scenario_pairs_with_observation'], '/ '+str(val['model_scenario_denominator']), 'units:', val['units_seen'])
          print('No account partition or I3 classification inferred.')
          PY
      - name: Inspect separately redistributed official-named metadata spreadsheet
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 120 \
            --output data/ar6-private/AR6_Scenarios_Database_metadata_indicators_v1.1.xlsx \
            'https://raw.githubusercontent.com/witch-team/energy-jobs-dataset-iiasadb/23e446a3de0a6d59243a536740576ab386e56ccc/AR6_Scenarios_Database_metadata_indicators_v1.1.xlsx'
          echo '7d22453bdda52e95cea4df46d362018951dd7114e62f01f5bcea65d6e24a7790  data/ar6-private/AR6_Scenarios_Database_metadata_indicators_v1.1.xlsx' | sha256sum --check
          python - <<'PY'
          from openpyxl import load_workbook
          p='data/ar6-private/AR6_Scenarios_Database_metadata_indicators_v1.1.xlsx'
          wb=load_workbook(p,read_only=True,data_only=True)
          print('Metadata redistribution source: witch-team GitHub, not official IIASA direct download')
          for name in wb.sheetnames:
              s=wb[name]
              rows=s.iter_rows(values_only=True)
              top=[next(rows,None) for _ in range(3)]
              print('SHEET:',repr(name),'rows:',s.max_row,'cols:',s.max_column)
              print('Top 3 rows, first 14 fields:',[list(r[:14]) if r else None for r in top])
          PY
      - name: Climate-category stratification of source and separately republished v1.1 metadata
        run: |
          python -m residual_pathways audit-ar6-strata \
            --input data/ar6-private/AR6-demo-data.csv \
            --metadata data/ar6-private/AR6_Scenarios_Database_metadata_indicators_v1.1.xlsx \
            --metadata-sheet meta_Ch3vetted_withclimate --category-column Category \
            --candidates config/ar6_variable_candidates.json \
            --year 2050 \
            --output results/ar6-teaching-pilot/vetted_coverage_2050.json
          python -m residual_pathways audit-ar6-strata \
            --input data/ar6-private/AR6-demo-data.csv \
            --metadata data/ar6-private/AR6_Scenarios_Database_metadata_indicators_v1.1.xlsx \
            --metadata-sheet meta --category-column Category \
            --candidates config/ar6_variable_candidates.json \
            --year 2050 \
            --output results/ar6-teaching-pilot/all_metadata_coverage_2050.json
          python - <<'PY'
          import json
          from pathlib import Path
          for key in ('vetted','all_metadata'):
              d=json.loads((Path('results/ar6-teaching-pilot')/(key+'_coverage_2050.json')).read_text())
              print('POPULATION',key,'source rows',d['source_rows_scanned'],
                    'metadata population',d['metadata_model_scenarios'],
                    'World source+metadata matched',d['matched_model_scenarios'],
                    'source without metadata',d['unmatched_source_model_scenarios_count'],
                    'metadata without source',d['unmatched_metadata_model_scenarios_count'])
              print('SOURCE SHA256',d['source_sha256'],'METADATA SHA256',d['metadata_sha256'])
              for cat,x in sorted(d['strata'].items()):
                  co=x['candidate_co_reporting']
                  print('CATEGORY',cat,'denominator',x['model_scenarios_in_source_and_metadata'],
                        'CO2',x['variable_coverage']['Emissions|CO2']['observed_model_scenarios'],
                        'DAC',x['variable_coverage']['Carbon Sequestration|Direct Air Capture']['observed_model_scenarios'],
                        'CO2_DAC_CO_REPORTED',co['co2_and_dac']['model_scenarios'],
                        'ALL_SIX_CO_REPORTED',co['co2_energy_land_ccs_dac']['model_scenarios'],
                        'NET_EIP_AFOLU_LAND_BIOMASS_DAC',co['eip_afolu_land_beccs_dac']['model_scenarios'],
                        'PLUS_FOSSIL_CCS',co['eip_afolu_land_beccs_dac_fossilccs']['model_scenarios'])
          print('STRICT INTERPRETATION: co-reporting presence only; zero verified I3 classifications.')
          PY
      - name: Assert all previously audited counts and metadata joins against committed reference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path('results/ar6-teaching-pilot')
          baseline=json.loads(Path('data/derived/ar6_teaching_2050_summary.json').read_text())
          aggregate=json.loads((source/'variable_coverage_2050.json').read_text())
          vetted=json.loads((source/'vetted_coverage_2050.json').read_text())
          broad=json.loads((source/'all_metadata_coverage_2050.json').read_text())
          assert aggregate['source_sha256']==baseline['world_source']['sha256']
          assert aggregate['world_model_scenario_pairs']==baseline['world_source']['world_model_scenario_pairs']
          assert aggregate['csv_series_rows']==baseline['world_source']['csv_iamc_series']
          for variable, count in baseline['candidate_counts_all_source'].items():
              got=aggregate['candidate_coverage'][next(k for k,v in json.loads(Path('config/ar6_variable_candidates.json').read_text()).items() if v==variable)]
              assert got['model_scenario_pairs_with_observation']==count,(variable,got['model_scenario_pairs_with_observation'],count)
              assert got['units_seen']==[baseline['observed_units'][variable]]
          assert vetted['metadata_model_scenarios']==1202
          assert vetted['matched_model_scenarios']==1202
          assert broad['metadata_model_scenarios']==2304
          assert broad['matched_model_scenarios']==2298
          for x in baseline['category_coverage']:
              v=vetted['strata'][x['category']]
              assert v['model_scenarios_in_source_and_metadata']==x['n'],x
              assert v['variable_coverage']['Emissions|CO2']['observed_model_scenarios']==x['co2']
              assert v['variable_coverage']['Carbon Sequestration|Direct Air Capture']['observed_model_scenarios']==x['dac']
              assert v['candidate_co_reporting']['co2_energy_land_ccs_dac']['model_scenarios']==x['all_six_candidate_presence']
              assert v['candidate_co_reporting']['eip_afolu_land_beccs_dac']['model_scenarios']==x['eip_afolu_land_beccs_dac']
              assert v['candidate_co_reporting']['eip_afolu_land_beccs_dac_fossilccs']['model_scenarios']==x['eip_afolu_land_beccs_dac_fossilccs']
          for x in baseline['non_vetted_groups']:
              v=broad['strata'][x['category']]
              assert v['model_scenarios_in_source_and_metadata']==x['n']
              assert v['variable_coverage']['Emissions|CO2']['observed_model_scenarios']==x['co2']
              assert v['variable_coverage']['Carbon Sequestration|Direct Air Capture']['observed_model_scenarios']==x['dac']
              assert v['candidate_co_reporting']['co2_energy_land_ccs_dac']['model_scenarios']==x['co_report_six']
          assert broad['source_sha256']==baseline['world_source']['sha256']
          assert sum(x['eip_afolu_land_beccs_dac'] for x in baseline['category_coverage'])==baseline['vetted_totals']['co_report_eip_afolu_land_beccs_dac']
          assert sum(x['eip_afolu_land_beccs_dac_fossilccs'] for x in baseline['category_coverage'])==baseline['vetted_totals']['co_report_eip_afolu_land_beccs_dac_fossilccs']
          assert broad['metadata_sha256']==baseline['metadata_source']['sha256']
          print('Independently checked repository research summary against streamed teaching CSV and pinned metadata.')
          PY
      - name: Run real 24-case forensic preflight; keep unredacted packet private
        run: |
          python -m residual_pathways case-audit \
            --input data/ar6-private/AR6-demo-data.csv \
            --metadata data/ar6-private/AR6_Scenarios_Database_metadata_indicators_v1.1.xlsx \
            --metadata-sheet meta_Ch3vetted_withclimate \
            --candidates config/ar6_variable_candidates.json \
            --public-output results/ar6-teaching-pilot/case_audit_24_public.json \
            --private-output data/ar6-private/case_audit_review_packet.json \
            --year 2050
          python - <<'PY'
          from pathlib import Path
          import json
          public_file=Path('results/ar6-teaching-pilot/case_audit_24_public.json')
          d=json.loads(public_file.read_text())
          baseline=json.loads(Path('data/derived/ar6_teaching_2050_summary.json').read_text())
          assert d['source_sha256']==baseline['world_source']['sha256']
          assert d['metadata_sha256']==baseline['metadata_source']['sha256']
          assert d['source_matched_cohort_size']==1202
          assert d['summary']['case_count']==24
          assert d['summary']['per_category']=={f'C{i}':3 for i in range(1,9)}
          assert d['summary']['reviewed_cases']==0
          assert d['summary']['verified_i3_cases']==0
          assert not d['selection']['probability_sample']
          assert all(case['human_review']=='NOT_REVIEWED' and
                     case['accounting_grade']=='NOT_DETERMINED' and
                     not case['i3_verified'] for case in d['cases'])
          assert len(set(x['case_id'] for x in d['cases']))==24
          assert 'source_observations' not in public_file.read_text()
          assert 'model_specific_definitions_ref' not in public_file.read_text()
          private_file=Path('data/ar6-private/case_audit_review_packet.json')
          assert private_file.exists() and 'source_observations' in private_file.read_text()
          print('RP24 SOURCE-BACKED FORENSIC PREFLIGHT:',d['summary'])
          for row in d['cases']:
              print(row['case_id'],row['category'],row['slot'],
                    'six_reporting',row['six_valid_unit_count'],
                    'three_term_diagnostic',row['arithmetic_diagnostic_possible'])
          print('All 24 selected on real input, no scientific human review falsely claimed.')
          PY
      - name: Upload AGGREGATE coverage only — never scenario rows
        uses: actions/upload-artifact@v4
        with:
          name: ar6-teaching-subset-variable-coverage-2050
          path: results/ar6-teaching-pilot/*.json
          retention-days: 15
