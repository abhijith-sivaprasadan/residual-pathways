[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-pathways"
version = "0.1.0"
description = "Auditable IAMC scenario coverage and cross-model comparisons"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = ["pyam-iamc==3.5.0"]
model = ["scipy>=1.11,<2"]
dev = ["pytest>=8,<10", "pyam-iamc==3.5.0", "scipy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
